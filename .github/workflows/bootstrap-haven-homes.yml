name: Bootstrap Haven Homes

on:
  workflow_dispatch:
    inputs:
      cloudfront_origin:
        description: Optional full CloudFront origin, for example https://d123.cloudfront.net
        required: false
        type: string

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CMS_GITHUB_TOKEN }}
      TARGET_REPO: matt-milzewski/haven-homes-co
      AWS_DEPLOY_ROLE_ARN: ${{ vars.HAVEN_AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION_VALUE: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      FORMS_API_BASE: ${{ vars.ANCHOR_FORMS_API_BASE }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      HAVEN_RECIPIENT_EMAIL: ${{ secrets.HAVEN_RECIPIENT_EMAIL }}
      CLOUDFRONT_ORIGIN: ${{ inputs.cloudfront_origin || 'https://dl4dzzrd6411l.cloudfront.net' }}
      PRIMARY_ORIGIN: https://havenhomesco.com.au
      WWW_ORIGIN: https://www.havenhomesco.com.au

    steps:
      - name: Validate source configuration
        run: |
          missing=0
          for var in GH_TOKEN AWS_DEPLOY_ROLE_ARN AWS_REGION_VALUE FORMS_API_BASE HAVEN_RECIPIENT_EMAIL; do
            if [ -z "${!var}" ]; then
              echo "Missing required Anchor configuration: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create repository if needed
        run: |
          if gh repo view "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Repository already exists: $TARGET_REPO"
          else
            gh repo create "$TARGET_REPO" \
              --public \
              --add-readme \
              --description "Premium home care and cleaning website for Brisbane's inner west."
          fi

      - name: Configure deployment variables
        run: |
          gh variable set AWS_REGION \
            --repo "$TARGET_REPO" \
            --body "$AWS_REGION_VALUE"
          gh variable set AWS_DEPLOY_ROLE_ARN \
            --repo "$TARGET_REPO" \
            --body "$AWS_DEPLOY_ROLE_ARN"
          gh variable set ANCHOR_FORMS_API_BASE \
            --repo "$TARGET_REPO" \
            --body "$FORMS_API_BASE"
          if [ -n "$TURNSTILE_SITE_KEY" ]; then
            gh variable set TURNSTILE_SITE_KEY --repo "$TARGET_REPO" --body "$TURNSTILE_SITE_KEY"
          fi

      - name: Register Haven with the shared forms service
        run: |
          if [[ ! "$CLOUDFRONT_ORIGIN" =~ ^https://[a-z0-9.-]+\.cloudfront\.net$ ]]; then
            echo "cloudfront_origin must be a full https://*.cloudfront.net origin"
            exit 1
          fi

          config="$(jq -cn \
            --arg cloudfront_origin "$CLOUDFRONT_ORIGIN" \
            --arg primary_origin "$PRIMARY_ORIGIN" \
            --arg www_origin "$WWW_ORIGIN" \
            --arg recipient_email "$HAVEN_RECIPIENT_EMAIL" \
            '{
              siteId: "haven-homes-co",
              name: "Haven Homes Co.",
              recipientEmail: $recipient_email,
              allowedOrigins: [$primary_origin, $www_origin, $cloudfront_origin],
              requiredFields: ["name", "address", "phone", "email", "service"],
              honeypotFields: ["company", "_gotcha", "website"],
              replyToField: "email",
              subjectPrefix: "[Haven Homes Co.]",
              subject: "New website quote enquiry",
              spamThreshold: 2,
              maxLinks: 2,
              minimumSubmitMs: 3000,
              allowedFields: ["name", "address", "phone", "email", "service", "message"],
              turnstileAction: "contact_submit",
              destinationRateLimitMaxRequests: 2
            }')"

          gh variable set HAVEN_FORM_SITE_CONFIG_JSON \
            --repo "matt-milzewski/AnchorWebCo" \
            --body "$config"

          gh workflow run deploy-forms.yml \
            --repo "matt-milzewski/AnchorWebCo" \
            --ref main \
            -f terraform_action=apply

      - name: Summary
        run: |
          {
            echo "## Haven Homes bootstrap complete"
            echo
            echo "- Repository: https://github.com/$TARGET_REPO"
            echo "- Repository-scoped AWS OIDC deployment role configured."
            echo "- Shared form API variable configured."
            if [ -n "$CLOUDFRONT_ORIGIN" ]; then
              echo "- Haven form configuration registered for $PRIMARY_ORIGIN, $WWW_ORIGIN and $CLOUDFRONT_ORIGIN."
              echo "- Anchor forms deployment dispatched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
