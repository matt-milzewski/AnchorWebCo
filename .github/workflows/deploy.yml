name: Deploy to AWS S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: anchor-web-co-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate production runtime configuration
        env:
          ANCHOR_FORMS_API_BASE: ${{ vars.ANCHOR_FORMS_API_BASE }}
          ANCHOR_ANALYTICS_SCRIPT_URL: ${{ vars.ANCHOR_ANALYTICS_SCRIPT_URL }}
          ANCHOR_ANALYTICS_INGEST_URL: ${{ vars.ANCHOR_ANALYTICS_INGEST_URL }}
          ANCHOR_POSTHOG_KEY: ${{ vars.ANCHOR_POSTHOG_KEY }}
          ANCHOR_POSTHOG_HOST: ${{ vars.ANCHOR_POSTHOG_HOST }}
        run: |
          set -euo pipefail
          for var in ANCHOR_FORMS_API_BASE ANCHOR_ANALYTICS_SCRIPT_URL ANCHOR_ANALYTICS_INGEST_URL ANCHOR_POSTHOG_KEY ANCHOR_POSTHOG_HOST; do
            if [ -z "${!var}" ]; then
              echo "Missing required repository variable: $var"
              exit 1
            fi
          done
          if [[ "$ANCHOR_POSTHOG_KEY" != phc_* ]]; then
            echo "ANCHOR_POSTHOG_KEY must be a PostHog project key beginning with phc_."
            exit 1
          fi
          if [ "$ANCHOR_POSTHOG_HOST" != "https://eu.i.posthog.com" ]; then
            echo "ANCHOR_POSTHOG_HOST must keep analytics data in the configured EU region."
            exit 1
          fi

      - name: Configure CMS admin API
        if: ${{ vars.ANCHOR_CMS_API_BASE != '' }}
        run: |
          node -e "const fs=require('fs'); const p='src/admin/index.html'; let html=fs.readFileSync(p,'utf8'); html=html.replace('window.ANCHOR_CMS_API_BASE = window.ANCHOR_CMS_API_BASE || \"\";', 'window.ANCHOR_CMS_API_BASE = \"' + process.env.ANCHOR_CMS_API_BASE + '\";'); fs.writeFileSync(p, html);"
        env:
          ANCHOR_CMS_API_BASE: ${{ vars.ANCHOR_CMS_API_BASE }}

      - name: Configure forms API
        if: ${{ vars.ANCHOR_FORMS_API_BASE != '' }}
        run: |
          node -e "const fs=require('fs'); const p='src/_includes/layouts/marketing-page.njk'; let html=fs.readFileSync(p,'utf8'); html=html.replace('window.ANCHOR_FORMS_API_BASE = window.ANCHOR_FORMS_API_BASE || \"\";', 'window.ANCHOR_FORMS_API_BASE = \"' + process.env.ANCHOR_FORMS_API_BASE + '\";'); fs.writeFileSync(p, html);"
        env:
          ANCHOR_FORMS_API_BASE: ${{ vars.ANCHOR_FORMS_API_BASE }}

      - name: Configure analytics
        run: |
          node -e "const fs=require('fs'); const p='src/_includes/footer.njk'; let html=fs.readFileSync(p,'utf8'); if (process.env.ANCHOR_ANALYTICS_SCRIPT_URL && process.env.ANCHOR_ANALYTICS_INGEST_URL) { html=html.replaceAll('__ANCHOR_ANALYTICS_SCRIPT_URL__', process.env.ANCHOR_ANALYTICS_SCRIPT_URL).replaceAll('__ANCHOR_ANALYTICS_INGEST_URL__', process.env.ANCHOR_ANALYTICS_INGEST_URL); } else { html=html.replace(/\\s*<script src=\"__ANCHOR_ANALYTICS_SCRIPT_URL__\"[^>]*><\\/script>/g, ''); } fs.writeFileSync(p, html);"
        env:
          ANCHOR_ANALYTICS_SCRIPT_URL: ${{ vars.ANCHOR_ANALYTICS_SCRIPT_URL }}
          ANCHOR_ANALYTICS_INGEST_URL: ${{ vars.ANCHOR_ANALYTICS_INGEST_URL }}

      - name: Configure PostHog
        run: |
          node -e "const fs=require('fs'); const p='src/js/posthog-init.js'; let js=fs.readFileSync(p,'utf8'); js=js.replaceAll('__ANCHOR_POSTHOG_KEY__', process.env.ANCHOR_POSTHOG_KEY).replaceAll('__ANCHOR_POSTHOG_HOST__', process.env.ANCHOR_POSTHOG_HOST); fs.writeFileSync(p, js);"
        env:
          ANCHOR_POSTHOG_KEY: ${{ vars.ANCHOR_POSTHOG_KEY }}
          ANCHOR_POSTHOG_HOST: ${{ vars.ANCHOR_POSTHOG_HOST }}

      - name: Build site
        env:
          ANCHOR_CMS_API_BASE: ${{ vars.ANCHOR_CMS_API_BASE }}
          ANCHOR_CMS_SITE_ID: anchor-web-co
        run: npm run build

      - name: Verify generated site
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync _site/ s3://anchorweb.co \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "health-check/*" \
            --exclude "health-check/**" \
            --exclude "README.md" \
            --exclude "bucket-policy.json" \
            --delete

      - name: Publish CloudFront viewer-request function
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          DIST=$(aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID")
          FUNCTION_ARN=$(echo "$DIST" | jq -r '
            [.DistributionConfig.DefaultCacheBehavior, (.DistributionConfig.CacheBehaviors.Items // [])[]]
            | map(.FunctionAssociations.Items // [])
            | add
            | map(select(.EventType == "viewer-request"))
            | .[0].FunctionARN // empty
          ')
          if [ -z "$FUNCTION_ARN" ]; then
            echo "No viewer-request CloudFront function associated with distribution; skipping."
            exit 0
          fi
          FUNCTION_NAME="${FUNCTION_ARN##*/}"
          echo "Updating CloudFront function: $FUNCTION_NAME"
          DESC=$(aws cloudfront describe-function --name "$FUNCTION_NAME")
          RUNTIME=$(echo "$DESC" | jq -r '.FunctionSummary.FunctionConfig.Runtime')
          ETAG=$(echo "$DESC" | jq -r '.ETag')
          aws cloudfront update-function \
            --name "$FUNCTION_NAME" \
            --if-match "$ETAG" \
            --function-config "Comment=anchor web routing,Runtime=$RUNTIME" \
            --function-code fileb://cloudfront-function.js >/dev/null
          NEW_ETAG=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'ETag' --output text)
          aws cloudfront publish-function --name "$FUNCTION_NAME" --if-match "$NEW_ETAG"
          echo "Published $FUNCTION_NAME."

      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

      - name: Verify production website and forms
        env:
          ANCHOR_FORMS_API_BASE: ${{ vars.ANCHOR_FORMS_API_BASE }}
        run: npm run verify:production
