name: Monitor managed websites

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: managed-site-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run uptime, SSL, core-page, form-page and endpoint checks
        id: checks
        continue-on-error: true
        run: node scripts/monitor-managed-sites.js | tee monitor-output.txt

      - name: Open or update a monitoring incident
        if: steps.checks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Automated website monitor detected a failure";
            const report = fs.readFileSync("monitor-output.txt", "utf8").slice(-6000);
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = open.find((issue) => issue.title === title);
            const body = `Monitor run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`\n${report}\n\`\`\``;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close resolved monitoring incidents
        if: steps.checks.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated website monitor detected a failure";
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            for (const issue of open.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "All configured checks passed on this monitor run. Closing the incident automatically."
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
            }

      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-site-monitor-${{ github.run_id }}
          path: monitor-output/
          retention-days: 30

      - name: Fail the workflow when a check failed
        if: steps.checks.outcome == 'failure'
        run: exit 1
